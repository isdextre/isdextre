<svg width="600" height="620" viewBox="0 0 600 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1035"/>
      <stop offset="55%" stop-color="#151233"/>
      <stop offset="100%" stop-color="#0b1730"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accentStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accentFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="620" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="600" height="620" rx="18" fill="url(#glow)"/>

  <text x="300" y="42" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700" letter-spacing="1">Core Skills</text>
  <text x="300" y="63" text-anchor="middle" fill="#b9b3d1" font-size="12" letter-spacing="2.5">SELF-ASSESSED · 1 = LEARNING · 5 = ADVANCED</text>

  <!-- grid rings -->
  <g fill="none" stroke="#5b5285" stroke-width="1">
    <polygon points="300.0,317.0 328.6,333.5 328.6,366.5 300.0,383.0 271.4,366.5 271.4,333.5" opacity="0.45"/>
    <polygon points="300.0,284.0 357.2,317.0 357.2,383.0 300.0,416.0 242.8,383.0 242.8,317.0" opacity="0.45"/>
    <polygon points="300.0,251.0 385.7,300.5 385.7,399.5 300.0,449.0 214.3,399.5 214.3,300.5" opacity="0.45"/>
    <polygon points="300.0,218.0 414.3,284.0 414.3,416.0 300.0,482.0 185.7,416.0 185.7,284.0" opacity="0.45"/>
    <polygon points="300.0,185.0 442.9,267.5 442.9,432.5 300.0,515.0 157.1,432.5 157.1,267.5" opacity="0.6"/>
  </g>

  <!-- axis lines -->
  <g stroke="#5b5285" stroke-width="1" opacity="0.6">
    <line x1="300" y1="350" x2="300.0" y2="185.0"/>
    <line x1="300" y1="350" x2="442.9" y2="267.5"/>
    <line x1="300" y1="350" x2="442.9" y2="432.5"/>
    <line x1="300" y1="350" x2="300.0" y2="515.0"/>
    <line x1="300" y1="350" x2="157.1" y2="432.5"/>
    <line x1="300" y1="350" x2="157.1" y2="267.5"/>
  </g>

  <!-- data area -->
  <polygon points="300.0,185.0 414.3,284.0 414.3,416.0 300.0,465.5 185.7,416.0 157.1,267.5"
           fill="url(#accentFill)" stroke="url(#accentStroke)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- data points, colored along the pink -> purple -> blue sweep -->
  <g stroke="#0b1730" stroke-width="1.5">
    <circle cx="300.0" cy="185.0" r="5.5" fill="#ec4899"/>
    <circle cx="414.3" cy="284.0" r="5.5" fill="#d14dbf"/>
    <circle cx="414.3" cy="416.0" r="5.5" fill="#b652e4"/>
    <circle cx="300.0" cy="465.5" r="5.5" fill="#925ef7"/>
    <circle cx="185.7" cy="416.0" r="5.5" fill="#6770f6"/>
    <circle cx="157.1" cy="267.5" r="5.5" fill="#3b82f6"/>
  </g>

  <!-- labels -->
  <g fill="#ffffff" font-size="14">
    <text x="300.0" y="130.0" text-anchor="middle" font-weight="600">Python</text>

    <text x="487.9" y="238.5" text-anchor="start" font-weight="600">
      <tspan x="487.9" dy="0">Machine</tspan>
      <tspan x="487.9" dy="17">Learning</tspan>
    </text>

    <text x="487.9" y="455.5" text-anchor="start" font-weight="600">
      <tspan x="487.9" dy="0">Geospatial</tspan>
      <tspan x="487.9" dy="17">/ GIS</tspan>
    </text>

    <text x="300.0" y="571.0" text-anchor="middle" font-weight="600">SQL</text>

    <text x="112.1" y="455.5" text-anchor="end" font-weight="600">
      <tspan x="112.1" dy="0">R</tspan>
    </text>

    <text x="112.1" y="238.5" text-anchor="end" font-weight="600">
      <tspan x="112.1" dy="0">Statistical</tspan>
      <tspan x="112.1" dy="17">Methods</tspan>
    </text>
  </g>

  <text x="300" y="602" text-anchor="middle" fill="#8a83ab" font-size="10.5" letter-spacing="1">github.com/isdextre</text>
</svg>
